apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  namespace: shortly

data:
  kong.yaml: |
    _format_version: '3.0'

    services:
      - name: shortly-api
        url: http://api:3333

        routes:
          - name: shortly-api-routes
            protocols:
              - http
            paths:
              - /api
              - /auth
              - /links
              - /r
              - /health
              - /ready
            strip_path: false

    plugins:
      - name: rate-limiting
        config:
          second: 5
          policy: local
